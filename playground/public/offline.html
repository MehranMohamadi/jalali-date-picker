<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050816">
    <title>پولدار | آفلاین</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 0, rgba(34, 211, 238, .28), transparent 32%),
          linear-gradient(160deg, #050816, #111827);
        color: #f8fafc;
        font-family: Tahoma, sans-serif;
      }

      main {
        width: min(420px, 100%);
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 24px;
        padding: 24px;
        background: rgba(15, 23, 42, .72);
        box-shadow: 0 24px 80px rgba(2, 8, 23, .42);
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>پولدار آفلاین است</h1>
      <p>اتصال اینترنت را بررسی کنید. اگر قبلا برنامه را باز کرده باشید، داده‌های ذخیره‌شده شما بعد از بارگذاری دوباره نمایش داده می‌شود.</p>
    </main>
  </body>
</html>
