<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="56" fill="url(#bg4)"/>
  <!-- Mane (Circle petal-like) -->
  <circle cx="60" cy="64" r="42" fill="url(#mane)"/>
  <!-- Ears -->
  <circle cx="36" cy="38" r="10" fill="#fde68a"/>
  <circle cx="36" cy="38" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="38" r="10" fill="#fde68a"/>
  <circle cx="84" cy="38" r="6" fill="#f59e0b"/>
  <!-- Head Face -->
  <ellipse cx="60" cy="66" rx="30" ry="28" fill="#fde68a"/>
  <!-- Snout -->
  <ellipse cx="60" cy="74" rx="14" ry="11" fill="#fffbeb"/>
  <!-- Eyes -->
  <ellipse cx="48" cy="60" rx="4" ry="5.5" fill="#0f172a"/>
  <circle cx="49" cy="58" r="1.6" fill="#ffffff"/>
  <ellipse cx="72" cy="60" rx="4" ry="5.5" fill="#0f172a"/>
  <circle cx="73" cy="58" r="1.6" fill="#ffffff"/>
  <!-- Big Nose -->
  <polygon points="60,72 53,66 67,66" fill="#78350f"/>
  <!-- Mouth -->
  <path d="M 55,75 Q 60,79 65,75" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Crown / Star on forehead -->
  <polygon points="60,42 63,48 70,49 65,54 66,60 60,57 54,60 55,54 50,49 57,48" fill="#f59e0b"/>
</svg>
