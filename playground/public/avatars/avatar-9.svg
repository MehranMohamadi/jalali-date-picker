<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="skin9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="hair9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg9)"/>
  
  <!-- Neck & Clothes -->
  <path d="M 48,82 L 72,82 L 72,94 L 48,94 Z" fill="url(#skin9)"/>
  <!-- T-shirt / Collar -->
  <path d="M 30,112 C 30,95 44,90 60,90 C 76,90 90,95 90,112 Z" fill="#1e293b"/>
  <path d="M 52,90 Q 60,98 68,90" fill="none" stroke="url(#skin9)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Ears -->
  <circle cx="36" cy="64" r="6.5" fill="url(#skin9)"/>
  <circle cx="84" cy="64" r="6.5" fill="url(#skin9)"/>
  
  <!-- Face -->
  <ellipse cx="60" cy="62" rx="24" ry="26" fill="url(#skin9)"/>
  
  <!-- Hair Base (Side and Top) -->
  <path d="M 34,54 C 33,36 46,28 60,28 C 74,28 87,36 86,54 C 84,51 79,45 68,44 C 54,43 45,47 34,54 Z" fill="url(#hair9)"/>
  <path d="M 33,52 C 37,34 50,29 64,29 C 78,29 88,38 87,50 C 82,42 72,40 60,40 C 48,40 38,46 33,52 Z" fill="url(#hair9)"/>
  
  <!-- Modern Glasses -->
  <rect x="40" y="54" width="16" height="13" rx="4" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="64" y="54" width="16" height="13" rx="4" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="56" y1="60" x2="64" y2="60" stroke="#0f172a" stroke-width="2.5"/>
  
  <!-- Eyes -->
  <circle cx="48" cy="60" r="2.8" fill="#0f172a"/>
  <circle cx="49" cy="59" r="0.9" fill="#ffffff"/>
  <circle cx="72" cy="60" r="2.8" fill="#0f172a"/>
  <circle cx="73" cy="59" r="0.9" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M 42,50 Q 48,48 54,51" fill="none" stroke="url(#hair9)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 66,51 Q 72,48 78,50" fill="none" stroke="url(#hair9)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M 60,63 L 58,68 L 62,68" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Smile -->
  <path d="M 53,74 Q 60,80 67,74" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
</svg>
