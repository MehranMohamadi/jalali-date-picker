<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="skin10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde2d0"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="hair10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg10)"/>

  <!-- Back Hair (Behind head and shoulders) -->
  <path d="M 32,56 C 26,72 26,92 34,106 C 42,98 42,88 38,72 Z" fill="url(#hair10)"/>
  <path d="M 88,56 C 94,72 94,92 86,106 C 78,98 78,88 82,72 Z" fill="url(#hair10)"/>

  <!-- Neck -->
  <path d="M 50,78 L 70,78 L 70,94 L 50,94 Z" fill="url(#skin10)"/>

  <!-- Outfit / Dress -->
  <path d="M 30,112 C 30,96 44,92 60,92 C 76,92 90,96 90,112 Z" fill="#4338ca"/>
  <path d="M 50,92 Q 60,102 70,92" fill="none" stroke="url(#skin10)" stroke-width="4" stroke-linecap="round"/>
  <!-- Necklace -->
  <circle cx="60" cy="98" r="2.5" fill="#facc15"/>

  <!-- Ears & Earrings -->
  <circle cx="36" cy="64" r="5.5" fill="url(#skin10)"/>
  <circle cx="35" cy="71" r="2.5" fill="#facc15"/>
  <circle cx="84" cy="64" r="5.5" fill="url(#skin10)"/>
  <circle cx="85" cy="71" r="2.5" fill="#facc15"/>

  <!-- Face -->
  <ellipse cx="60" cy="63" rx="22" ry="24" fill="url(#skin10)"/>

  <!-- Front Hair -->
  <path d="M 36,54 C 34,36 46,26 60,26 C 74,26 86,36 84,54 C 80,44 70,40 56,42 C 46,43 39,48 36,54 Z" fill="url(#hair10)"/>
  <!-- Side locks -->
  <path d="M 36,48 C 38,58 35,72 38,78 C 39,72 40,62 39,52 Z" fill="url(#hair10)"/>
  <path d="M 84,48 C 82,58 85,72 82,78 C 81,72 80,62 81,52 Z" fill="url(#hair10)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="45" cy="69" rx="4" ry="2.5" fill="#f43f5e" opacity="0.3"/>
  <ellipse cx="75" cy="69" rx="4" ry="2.5" fill="#f43f5e" opacity="0.3"/>

  <!-- Eyes & Eyelashes -->
  <ellipse cx="48" cy="61" rx="3.5" ry="4.5" fill="#1e1b4b"/>
  <circle cx="49" cy="59.5" r="1.3" fill="#ffffff"/>
  <path d="M 43,57 Q 48,54 53,58" fill="none" stroke="#1e1b4b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Eyelash flick -->
  <path d="M 52,57 L 55,55" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round"/>

  <ellipse cx="72" cy="61" rx="3.5" ry="4.5" fill="#1e1b4b"/>
  <circle cx="73" cy="59.5" r="1.3" fill="#ffffff"/>
  <path d="M 67,58 Q 72,54 77,57" fill="none" stroke="#1e1b4b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Eyelash flick -->
  <path d="M 77,57 L 80,55" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M 43,53 Q 48,50 53,53" fill="none" stroke="#4c1d95" stroke-width="2" stroke-linecap="round"/>
  <path d="M 67,53 Q 72,50 77,53" fill="none" stroke="#4c1d95" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 60,63 L 59,67 L 62,67" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Lips / Smile -->
  <path d="M 54,73 Q 60,78 66,73" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 56,73 Q 60,76 64,73" fill="#fda4af" opacity="0.7"/>
</svg>
