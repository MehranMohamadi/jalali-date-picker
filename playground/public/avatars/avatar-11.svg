<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="skin11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hair11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg11)"/>

  <!-- Neck -->
  <path d="M 48,80 L 72,80 L 72,94 L 48,94 Z" fill="url(#skin11)"/>

  <!-- Suit / Blazer & Shirt -->
  <path d="M 30,112 C 30,94 44,90 60,90 C 76,90 90,94 90,112 Z" fill="#0f172a"/>
  <!-- White V-neck shirt -->
  <polygon points="60,108 50,90 70,90" fill="#f8fafc"/>
  <!-- Lapels -->
  <polygon points="46,90 54,106 38,112" fill="#1e293b"/>
  <polygon points="74,90 66,106 82,112" fill="#1e293b"/>

  <!-- Ears -->
  <circle cx="35" cy="62" r="6" fill="url(#skin11)"/>
  <circle cx="85" cy="62" r="6" fill="url(#skin11)"/>

  <!-- Face -->
  <ellipse cx="60" cy="61" rx="23" ry="25" fill="url(#skin11)"/>

  <!-- Groomed Beard & Mustache -->
  <!-- Jawline beard -->
  <path d="M 37,60 C 37,84 46,94 60,94 C 74,94 83,84 83,60 C 81,74 74,86 60,86 C 46,86 39,74 37,60 Z" fill="url(#hair11)"/>
  <!-- Chin beard -->
  <path d="M 48,78 C 48,91 53,93 60,93 C 67,93 72,91 72,78 C 66,82 54,82 48,78 Z" fill="url(#hair11)"/>
  <!-- Mustache -->
  <path d="M 47,73 C 51,70 56,70 60,73 C 64,70 69,70 73,73 C 68,76 64,76 60,74 C 56,76 52,76 47,73 Z" fill="url(#hair11)"/>

  <!-- Modern Haircut -->
  <path d="M 35,52 C 34,34 46,26 60,26 C 74,26 86,34 85,52 C 81,40 70,36 58,37 C 46,38 38,44 35,52 Z" fill="url(#hair11)"/>
  <!-- Hair volume / texture -->
  <path d="M 38,42 C 45,30 62,26 78,32 C 86,36 84,46 84,50 C 76,38 64,36 50,40 C 42,42 39,46 38,42 Z" fill="#334155"/>

  <!-- Eyebrows -->
  <path d="M 43,49 Q 49,47 55,50" fill="none" stroke="url(#hair11)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 65,50 Q 71,47 77,49" fill="none" stroke="url(#hair11)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="49" cy="57" rx="3.5" ry="4" fill="#0f172a"/>
  <circle cx="50" cy="56" r="1.2" fill="#ffffff"/>
  <ellipse cx="71" cy="57" rx="3.5" ry="4" fill="#0f172a"/>
  <circle cx="72" cy="56" r="1.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M 60,59 L 58,66 L 62,66" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Friendly Smile in beard -->
  <path d="M 54,77 Q 60,82 66,77" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
</svg>
