<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="owlbody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="56" fill="url(#bg2)"/>
  <!-- Feather Tufts / Ears -->
  <polygon points="32,24 22,48 46,42" fill="#334155"/>
  <polygon points="88,24 98,48 74,42" fill="#334155"/>
  <!-- Body / Head -->
  <ellipse cx="60" cy="64" rx="38" ry="36" fill="url(#owlbody)"/>
  <!-- Belly -->
  <ellipse cx="60" cy="74" rx="26" ry="24" fill="#cbd5e1" opacity="0.9"/>
  <!-- Glasses Frame -->
  <circle cx="45" cy="56" r="15" fill="#f8fafc" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="75" cy="56" r="15" fill="#f8fafc" stroke="#f59e0b" stroke-width="3"/>
  <line x1="57" y1="56" x2="63" y2="56" stroke="#f59e0b" stroke-width="3"/>
  <!-- Pupils -->
  <circle cx="46" cy="56" r="6" fill="#0f172a"/>
  <circle cx="48" cy="54" r="2" fill="#ffffff"/>
  <circle cx="74" cy="56" r="6" fill="#0f172a"/>
  <circle cx="76" cy="54" r="2" fill="#ffffff"/>
  <!-- Beak -->
  <polygon points="60,63 56,71 64,71" fill="#ea580c"/>
  <!-- Graduation cap or bowtie -->
  <polygon points="60,84 52,90 52,78" fill="#f59e0b"/>
  <polygon points="60,84 68,90 68,78" fill="#f59e0b"/>
  <circle cx="60" cy="84" r="3" fill="#b45309"/>
</svg>
