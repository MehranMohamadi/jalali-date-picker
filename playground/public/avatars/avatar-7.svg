<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="56" fill="url(#bg7)"/>
  <!-- Ears -->
  <circle cx="32" cy="34" r="14" fill="#0f172a"/>
  <circle cx="88" cy="34" r="14" fill="#0f172a"/>
  <!-- Head -->
  <ellipse cx="60" cy="64" rx="38" ry="34" fill="#f8fafc"/>
  <!-- Eye Patches -->
  <ellipse cx="43" cy="60" rx="10" ry="13" fill="#0f172a" transform="rotate(-15 43 60)"/>
  <ellipse cx="77" cy="60" rx="10" ry="13" fill="#0f172a" transform="rotate(15 77 60)"/>
  <!-- Eyes -->
  <circle cx="44" cy="59" r="4" fill="#ffffff"/>
  <circle cx="45" cy="59" r="2" fill="#0f172a"/>
  <circle cx="76" cy="59" r="4" fill="#ffffff"/>
  <circle cx="75" cy="59" r="2" fill="#0f172a"/>
  <!-- Cheeks -->
  <ellipse cx="32" cy="74" rx="5" ry="3.5" fill="#f43f5e" opacity="0.45"/>
  <ellipse cx="88" cy="74" rx="5" ry="3.5" fill="#f43f5e" opacity="0.45"/>
  <!-- Nose -->
  <ellipse cx="60" cy="70" rx="6" ry="4.5" fill="#0f172a"/>
  <!-- Mouth -->
  <path d="M 55,75 Q 60,79 65,75" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
